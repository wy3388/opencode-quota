name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; do not rely on the bundled one.
      - run: npm i -g npm@latest

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@wy3366/opencode-quota@${version}" version >/dev/null 2>&1; then
            echo "::notice::@wy3366/opencode-quota@${version} is already published, skipping"
            exit 0
          fi
          npm publish
